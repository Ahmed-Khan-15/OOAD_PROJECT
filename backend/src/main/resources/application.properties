spring.application.name=global-health-explorer

server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/global_health_explorer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

spring.flyway.enabled=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.admin.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.admin.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.admin.bootstrap.display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
